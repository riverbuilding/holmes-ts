name: holmes-ts-lifecycle-validation

services:
  crashed:
    image: alpine:3.21
    command:
      - sh
      - -c
      - "echo 'startup failed: REQUIRED_SETTING is not configured'; exit 1"

  unhealthy:
    image: alpine:3.21
    command:
      - sh
      - -c
      - while true; do sleep 1; done
    healthcheck:
      test:
        - CMD-SHELL
        - exit 1
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 0s
